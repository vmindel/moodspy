[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "moodspy"
version = "0.1.0"
description = "Fast PWM motif matching for Python: a modern rewrite of MOODS with a motifmatchr-style API"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Vova Mindel", email = "vovamindel@gmail.com" }]
keywords = ["bioinformatics", "motif", "PWM", "PSSM", "transcription factor", "MOODS", "motifmatchr", "ATAC-seq"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "numba>=0.58",
]

[project.optional-dependencies]
anndata = ["anndata>=0.9"]
test = ["pytest>=7", "anndata>=0.9"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.26", "ruff", "anndata>=0.9"]

[project.scripts]
moodspy = "moodspy.cli:main"
moodspy-install-skills = "moodspy._skills.install:main"

[tool.hatch.build.targets.wheel]
packages = ["src/moodspy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
